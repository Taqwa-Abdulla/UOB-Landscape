<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <header class="bg-white shadow">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Resource Management Dashboard</h1>
            <nav class="space-x-4">
                <button onclick="switchTab('projects')" id="btn-projects" class="tab-btn px-4 py-2 bg-blue-600 text-white rounded font-medium">Projects</button>
                <button onclick="switchTab('records')" id="btn-records" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded font-medium">Records</button>
                <button onclick="switchTab('costs')" id="btn-costs" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded font-medium">Costs</button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        
        <!-- PROJECTS SECTION -->
        <section id="section-projects" class="tab-content">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-2xl font-semibold text-gray-700">Projects Management</h2>
                <div class="flex flex-wrap gap-3 w-full md:w-auto items-center">
                    <input type="text" id="search-projects" placeholder="Search projects or location..." class="border rounded px-3 py-2 text-sm w-full md:w-56" onkeyup="loadProjects()">
                    
                    <select id="filter-projects-status" class="border rounded px-3 py-2 text-sm" onchange="loadProjects()">
                        <option value="">All Statuses</option>
                        <option value="unknown">Unknown</option>
                        <option value="planning">Planning</option>
                        <option value="in progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>

                    <!-- Sort Controls Dropdowns -->
                    <div class="flex gap-2">
                        <select id="sort-projects-by" class="border rounded px-3 py-2 text-sm bg-white" onchange="loadProjects()">
                            <option value="created_at">Sort by: Date Created</option>
                            <option value="project_id">Sort by: ID</option>
                            <option value="title_en">Sort by: Title (EN)</option>
                            <option value="project_status">Sort by: Status</option>
                        </select>
                        <select id="sort-projects-order" class="border rounded px-3 py-2 text-sm bg-white" onchange="loadProjects()">
                            <option value="DESC">Descending (DESC)</option>
                            <option value="ASC">Ascending (ASC)</option>
                        </select>
                    </div>

                    <button onclick="openModal('project', 'create')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-nowrap">Add Project</button>
                </div>
            </div>
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">ID</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Title (EN)</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Location</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-right text-xs font-semibold text-gray-600 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- RECORDS SECTION -->
        <section id="section-records" class="tab-content hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-2xl font-semibold text-gray-700">Records Management</h2>
                <div class="flex flex-wrap gap-3 w-full md:w-auto items-center">
                    <input type="text" id="search-records" placeholder="Search actions or location..." class="border rounded px-3 py-2 text-sm w-full md:w-56" onkeyup="loadRecords()">
                    <input type="number" id="filter-records-year" placeholder="Year" class="border rounded px-3 py-2 text-sm w-20" onkeyup="loadRecords()" onchange="loadRecords()">
                    
                    <!-- Sort Controls Dropdowns -->
                    <div class="flex gap-2">
                        <select id="sort-records-by" class="border rounded px-3 py-2 text-sm bg-white" onchange="loadRecords()">
                            <option value="created_at">Sort by: Date Created</option>
                            <option value="record_id">Sort by: ID</option>
                            <option value="year">Sort by: Year</option>
                            <option value="action_en">Sort by: Action (EN)</option>
                            <option value="estimated_cost">Sort by: Estimated Cost</option>
                        </select>
                        <select id="sort-records-order" class="border rounded px-3 py-2 text-sm bg-white" onchange="loadRecords()">
                            <option value="DESC">Descending (DESC)</option>
                            <option value="ASC">Ascending (ASC)</option>
                        </select>
                    </div>

                    <button onclick="openModal('record', 'create')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-nowrap">Add Record</button>
                </div>
            </div>
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">ID</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Year</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Action (EN)</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Location</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Estimated Cost</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-right text-xs font-semibold text-gray-600 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="records-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- COSTS SECTION -->
        <section id="section-costs" class="tab-content hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-2xl font-semibold text-gray-700">Costs Management</h2>
                <div class="flex gap-3 w-full md:w-auto">
                    <input type="text" id="search-costs" placeholder="Search reference..." class="border rounded px-3 py-2 text-sm w-full md:w-64" onkeyup="loadCosts()">
                    <button onclick="openModal('cost', 'create')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-nowrap">Add Cost</button>
                </div>
            </div>
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">ID</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Reference Type</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Reference Name</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">Unit Cost</th>
                            <th class="px-5 py-3 border-b bg-gray-50 text-right text-xs font-semibold text-gray-600 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="costs-table-body"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Generic Modal Form -->
    <div id="data-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-gray-800">Add Item</h3>
            <form id="generic-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-resource">
                <input type="hidden" id="form-id">
                <div id="form-fields-container" class="space-y-4"></div>
                <div class="mt-6 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../../js/improvements/projects.js" defer></script>
</body>
</html>
