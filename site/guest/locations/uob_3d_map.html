<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UOB Advanced Smart Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
  
  <style>
    .custom-toggle-btn {
      width: 50px;
      height: 34px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 10px;
      color: #2c3e50;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .custom-toggle-btn:hover { background: #f1f2f6; }
    .view-perspective-active { background: #2c3e50 !important; color: #ffffff !important; }
  </style>
</head>
<body class="m-0 p-0 flex h-screen font-sans overflow-hidden bg-slate-100">


  <div id="map" class="flex-1 h-full"></div>


  <div id="story-panel" class="w-95 h-full bg-white p-6 shadow-xl z-10 box-border border-l border-slate-200 flex flex-col">
    <h2 class="text-slate-800 text-xl font-bold uppercase tracking-wider mb-1">UOB Explorer</h2>
    <div class="text-slate-500 text-xs mb-5">Search buildings or toggle categories to isolate facilities.</div>
    
    
    <div class="relative mb-4">
      <input 
        type="text" 
        id="search-bar" 
        placeholder="Search campus locations..." 
        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-md text-sm outline-none transition-all focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
      >
    </div>

    
    <div class="flex gap-2 mb-5 flex-wrap">
      <button class="filter-chip active px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-slate-300 bg-slate-50 text-slate-600 transition-all [&.active]:bg-sky-600 [&.active]:text-white [&.active]:border-sky-600" data-cat="building">
        Buildings
      </button>
      <button class="filter-chip active px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-slate-300 bg-slate-50 text-slate-600 transition-all [&.active]:bg-amber-600 [&.active]:text-white [&.active]:border-amber-600" data-cat="facility">
        Facilities
      </button>
      <button class="filter-chip active px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-slate-300 bg-slate-50 text-slate-600 transition-all [&.active]:bg-purple-600 [&.active]:text-white [&.active]:border-purple-600" data-cat="infrastructure">
        Infrastructures
      </button>
       <button class="filter-chip active px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-slate-300 bg-slate-50 text-slate-600 transition-all [&.active]:bg-blue-600 [&.active]:text-white [&.active]:border-blue-600" data-cat="roadside">
        Roadsides
      </button>
      <button class="filter-chip active px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-slate-300 bg-slate-50 text-slate-600 transition-all [&.active]:bg-red-600 [&.active]:text-white [&.active]:border-red-600" data-cat="gate">
        Gates
      </button>
      <button class="filter-chip active px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-slate-300 bg-slate-50 text-slate-600 transition-all [&.active]:bg-green-600 [&.active]:text-white [&.active]:border-green-600" data-cat="park">
        Parks
      </button>
     
    </div>

    
    <div id="info-content" class="pt-4 border-t border-slate-100 flex-1 overflow-y-auto">
      <div id="fallback-msg" class="text-slate-400 italic text-center mt-10 text-xs">
        Click a vector marker node or search above to load location parameters...
      </div>
      
      <div id="active-details" class="hidden">
        <span id="loc-badge" class="inline-block px-2 py-1 rounded text-[10px] font-bold uppercase text-white mb-3"></span>
        <div id="loc-title" class="text-slate-800 text-xl font-bold mb-1.5"></div>
        <div id="loc-desc" class="text-slate-600 text-sm leading-relaxed"></div>
      </div>
    </div>
  </div>

  
  <script src="../../../js/locations/map.js" defer></script>
</body>
</html>
